<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d5e63">
  <title>Reset password · iAssist Book-In</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f3f6f6; --surface:#fff; --ink:#142124; --muted:#5b6b6e; --line:#d4dddd; --accent:#0d5e63; --danger:#b3261e; --danger-soft:#fbe3e1;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1719; --surface:#172225; --ink:#e6eeef; --muted:#98a9ac; --line:#2c3d41;
      --accent:#4fb8b4; --danger:#ff8a80; --danger-soft:#3b1d1b; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
    main { max-width: 460px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 18px; }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { margin: 0; font-size: 1.6rem; }
    form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem; }
    .hint { font-weight: 400; color: var(--muted); }
    input { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 1.05rem; }
    button { min-height: 54px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
    button[disabled] { opacity: .5; }
    .err { color: var(--danger); background: var(--danger-soft); padding: 10px 14px; border-radius: 10px; font-weight: 600; margin: 0; }
    .muted { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="icons/icon.svg" alt=""><span>iAssist Book-In</span></div>
    <h1 id="title">Choose a new password</h1>
    <form id="f">
      <label>New password <span class="hint">At least 10 characters. Save it in your password manager.</span>
        <input type="password" id="p1" autocomplete="new-password" minlength="10" required></label>
      <label>New password again<input type="password" id="p2" autocomplete="new-password" minlength="10" required></label>
      <p class="err" id="err" hidden></p>
      <button type="submit" id="go">Save new password</button>
      <a href="./" class="muted">Back to sign-in</a>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script type="module">
    // Standalone on purpose: a new page has no old saved copy on the phone, so the reset link always opens here.
    // The token is only used when "Save new password" is pressed, so email link-checkers can't use it up.
    import { CONFIG } from './js/config.js?v=20261107152030';
    const $ = id => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');
    const fail = msg => { $('err').textContent = msg; $('err').hidden = false; $('go').disabled = false; };
    if (!token) fail('This page needs the link from your reset email. Use “Forgot password?” on the sign-in page to get one.');
    const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey,
      { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'iassist-crm-auth', detectSessionInUrl: false } });
    $('f').onsubmit = async e => {
      e.preventDefault();
      $('err').hidden = true;
      if (!token) return fail('This page needs the link from your reset email.');
      if ($('p1').value !== $('p2').value) return fail('The two passwords don’t match.');
      if ($('p1').value.length < 10) return fail('Use at least 10 characters.');
      $('go').disabled = true; $('go').textContent = 'Saving…';
      const { error: ve } = await sb.auth.verifyOtp({ token_hash: token, type: 'recovery' });
      if (ve) { $('go').textContent = 'Save new password'; return fail(/expired|invalid/i.test(ve.message)
        ? 'This link has expired or a newer reset email was sent. Open the newest email, or use “Forgot password?” again.' : ve.message); }
      const { error } = await sb.auth.updateUser({ password: $('p1').value });
      if (error) { $('go').textContent = 'Save new password'; return fail(error.message); }
      try { sessionStorage.setItem('crm.session', JSON.stringify({ id: (await sb.auth.getUser()).data.user.id, at: Date.now() })); } catch {}
      $('title').textContent = 'Password changed';
      $('f').innerHTML = '<p>You’re signed in. Opening the CRM…</p>';
      setTimeout(() => { location.href = './?v=' + Date.now(); }, 1200);
    };
  </script>
</body>
</html>
