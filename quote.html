<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d5e63">
  <title>Your quote · iAssist</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f3f6f6; --surface:#fff; --ink:#142124; --muted:#5b6b6e; --line:#d4dddd; --accent:#0d5e63; --accent-soft:#d8ecec;
      --ok:#1f7a3f; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1719; --surface:#172225; --ink:#e6eeef; --muted:#98a9ac; --line:#2c3d41;
      --accent:#4fb8b4; --accent-soft:#163b3c; --ok:#74d39a; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
    main { max-width: 560px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; line-height: 1.25; text-wrap: balance; }
    .muted { color: var(--muted); }
    .status { display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; }
    .status.done { background: var(--ok); }
    ol.steps { list-style: none; margin: 0; padding: 0; }
    ol.steps li { position: relative; padding: 0 0 18px 26px; }
    ol.steps li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    ol.steps li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
    ol.steps li.todo::before { background: var(--line); }
    ol.steps li.todo { color: var(--muted); }
    .when { font-size: .85rem; color: var(--muted); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: .85rem; }
    td.n, th.n { text-align: right; white-space: nowrap; }
    tfoot td { border-bottom: 0; }
    tfoot tr.grand td { font-size: 1.15rem; font-weight: 700; border-top: 2px solid var(--ink); }
    .actions { display: grid; gap: 10px; }
    button { font: inherit; font-weight: 700; border-radius: 12px; padding: 14px 18px; cursor: pointer; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); min-height: 52px; }
    button.yes { background: var(--ok); border-color: var(--ok); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    .ans { padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); font-weight: 600; }
    .err { color: #b3261e; }
    @media (prefers-color-scheme: dark) { .err { color: #ffb4ab; } }
  </style>
</head>
<body>
  <main id="app"><p class="muted">Loading your quote…</p></main>
  <script type="module" src="js/quote-page.js?v=20261107152030"></script>
</body>
</html>
