# Keeps the free Supabase project awake. Supabase pauses free projects after 7 days with no
# activity; this touches the database once a day so that never happens.
# Once a month it also commits a date stamp, because GitHub switches off scheduled jobs in
# public repos that have had no commits for 60 days.
# Source of truth: My Drive/CRM/github/keepalive.yml (publish.py copies it into the repo).
name: Keep database awake
on:
  schedule:
    - cron: "17 3 * * *"   # 05:17 SAST every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        run: |
          # Asks the public tracking function for a job that doesn't exist. It reads the jobs
          # table (counts as activity) and returns "not found". No data or keys involved.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"token":"keepalive-ping-not-a-real-job"}' \
            https://ffoehufktdvmwkzxyqng.supabase.co/functions/v1/track)
          echo "Supabase answered $code"
          if [ "$code" != "404" ]; then echo "Expected 404 (not found). The project may be paused."; exit 1; fi
      - uses: actions/checkout@v4
      - name: Monthly date stamp (stops GitHub switching this job off)
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +%Y-%m-%d > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git diff --cached --quiet || { git commit -q -m "Keep-alive stamp"; git push -q; }
          else
            echo "Not the 1st of the month, no stamp needed"
          fi
